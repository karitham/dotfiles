<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:light dark;--bg:var(--albedo-bg,#fbfaf8);--surface:var(--albedo-surface,#fff);--text:var(--albedo-text,#2b2f36);--muted:var(--albedo-muted,#6b7280);--faint:var(--albedo-faint,#9ca3af);--accent:var(--albedo-accent,#7c5cff);--border:var(--albedo-border,#e7e5e2);--add:var(--albedo-added,#2f855a);--del:var(--albedo-danger,#c2453a);--sans:var(--albedo-sans,system-ui,sans-serif);--mono:var(--albedo-mono,ui-monospace,monospace)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16.5px/1.72 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:56px 28px 120px}
.prose{max-width:680px}
h1{font-size:30px;line-height:1.2;margin:0 0 12px;font-weight:640;letter-spacing:-.015em}
h2{font-size:23px;line-height:1.25;margin:0;font-weight:630;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 4px;font-weight:600}
p{margin:0 0 12px}
code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--text) 6%,transparent);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.lede{font-size:18px;color:var(--muted);margin-bottom:28px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.toc a{color:inherit;text-decoration:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.toc a b{font-family:var(--mono);font-weight:600;color:var(--accent);margin-right:6px;font-size:13px}
section.chapter{margin-top:96px;scroll-margin-top:24px}
.kicker{font:600 12.5px var(--mono);letter-spacing:.04em;color:var(--accent);text-transform:lowercase;margin-bottom:6px}
.meta{font-size:13.5px;color:var(--faint);margin:6px 0 0}
.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:40px;margin-top:28px;align-items:start}
.overview .label{font-size:13px;color:var(--faint);margin-bottom:6px}
ol.steps-short{margin:14px 0 0;padding-left:22px}ol.steps-short li{margin:6px 0}
ol.steps-short a{color:inherit;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.diagram{border:1px solid var(--border);background:var(--surface);border-radius:14px;overflow:hidden}
.diagram+.diagram{margin-top:16px}
.diagram .dh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.diagram .dh .counts{font:600 13px var(--mono)}.counts .a{color:var(--add)}.counts .d{color:var(--del)}
.diagram .cap{padding:12px 16px 4px;font-size:13.5px;color:var(--muted)}
.diagram .rows{padding:4px 0 12px;overflow-x:auto}
.row{display:grid;grid-template-columns:22px auto 1fr auto;align-items:baseline;gap:0 10px;padding:3px 14px 3px 0;border-left:3px solid transparent;font:13.5px/1.6 var(--mono);white-space:nowrap}
.row .sign{text-align:center;font-weight:700}
.row.add{background:color-mix(in srgb,var(--add) 8%,transparent);border-color:var(--add)}.row.add .sign{color:var(--add)}
.row.del{background:color-mix(in srgb,var(--del) 8%,transparent);border-color:var(--del)}.row.del .sign{color:var(--del)}
.row .dnote{font:13px/1.5 var(--sans);color:var(--faint);white-space:normal;padding-left:10px;min-width:90px}
.row.add .dnote,.row.del .dnote{color:var(--muted)}
.row .tag{font:600 11px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 5px;margin-left:10px}
.walk{margin-top:56px}
.walk>h3{font-size:13px;color:var(--faint);font-weight:500;margin-bottom:14px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;padding:22px 0;border-top:1px solid var(--border);scroll-margin-top:24px}
.step .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);font:600 13px var(--mono);color:var(--accent)}
.step .body{max-width:700px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px}
.chips span{font:12px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 7px;background:var(--surface)}
details.code{margin-top:6px}
details.code summary{cursor:pointer;font-size:14px;color:var(--accent);list-style:none;user-select:none}
details.code summary::before{content:"▸ ";}details.code[open] summary::before{content:"▾ "}
.excerpt{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;max-width:820px}
.excerpt .fn{font:12px var(--mono);color:var(--faint);padding:7px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.excerpt pre{margin:0;padding:10px 12px;overflow:auto;max-height:460px;font:12.5px/1.55 var(--mono);background:var(--surface)}
.shiki,.shiki span{background-color:transparent!important}
@media (prefers-color-scheme:dark){.shiki,.shiki span{color:var(--shiki-dark)!important}}
.notes{margin-top:48px;max-width:760px}
.notes>h3{font-size:13px;color:var(--faint);font-weight:500;margin-bottom:10px}
.note{padding:14px 0;border-top:1px solid var(--border)}
.note .t{font-weight:600}.note .w{font:12.5px var(--mono);color:var(--faint)}
.sev{font:600 11px var(--mono);border-radius:999px;padding:1px 7px;margin-right:8px;border:1px solid currentColor;vertical-align:2px}
.sev.major,.sev.blocker{color:var(--del)}.sev.minor{color:#b7791f}.sev.nit{color:var(--faint)}
.note button{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 9px;margin-top:6px}
.note button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:12px 0;border-top:1px solid var(--border)}
.verdict{margin-top:18px;font-size:15px}.verdict b{color:var(--add)}
.skipped{margin-top:18px;font-size:13.5px;color:var(--faint)}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:10px 20px;display:none;justify-content:center;gap:14px;align-items:center;font-size:14px}
.bar.on{display:flex}.bar button{all:unset;cursor:pointer;background:var(--accent);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600}
@media (max-width:860px){.row{grid-template-columns:22px minmax(0,1fr) auto;white-space:normal;padding-top:4px;padding-bottom:4px}.row>span:nth-child(2){overflow-wrap:anywhere}.row .dnote{grid-column:2;grid-row:2;padding-left:0;min-width:0;font-size:12.5px}.row .tag{grid-column:3;grid-row:1}main{padding:32px 18px 120px}.overview{grid-template-columns:minmax(0,1fr);gap:24px}h1{font-size:25px}section.chapter{margin-top:72px}.step{grid-template-columns:36px minmax(0,1fr)}}
</style></head><body><main id="root"></main><div class="bar" id="bar"><span id="barText"></span><button id="send">send to chat</button></div>
<script>const GUIDE=__DATA__;</script>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const KEY='guide-picks:'+GUIDE.title, picks=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
function diagram(d,ch){const a=d.lines.filter(l=>l.kind==='add').length,r=d.lines.filter(l=>l.kind==='del').length;
 return `<div class="diagram"><div class="dh"><span>${esc(d.title||'before / after')}</span>${d.title?'':`<span class="counts"><span class="a">+${a}</span> <span class="d">−${r}</span></span>`}</div>${d.caption?`<div class="cap">${md(d.caption)}</div>`:''}<div class="rows">${d.lines.map(l=>`<div class="row ${l.kind||''}"><span class="sign">${l.kind==='add'?'+':l.kind==='del'?'−':''}</span><span style="padding-left:${(l.indent||0)*18}px">${esc(l.code)}</span><span class="dnote">${md(l.note||'')}</span>${l.step?`<span class="tag">${String(l.step).padStart(2,'0')}</span>`:'<span></span>'}</div>`).join('')}</div></div>`}
function note(ch,n,i){const id=`${ch.id}:${i}`;return `<div class="note"><span class="sev ${n.severity}">${n.severity}</span><span class="t">${md(n.title)}</span><div class="w">${esc(n.where||'')}</div><p style="margin:6px 0 0">${md(n.why)}</p><button data-pick="${id}" aria-pressed="${picks.has(id)}">${picks.has(id)?'asking for this':'ask for this'}</button></div>`}
function chapter(ch,idx,total){const steps=ch.steps||[], notes=ch.notes||[], main=notes.filter(n=>['blocker','major'].includes(n.severity)), rest=notes.filter(n=>!['blocker','major'].includes(n.severity));
 return `<section class="chapter" id="${ch.id}">${total>1?`<div class="kicker">${idx+1} of ${total}${ch.ref?` · ${esc(ch.ref)}`:''}</div>`:''}<h2>${md(ch.title)}</h2>${ch.meta?`<div class="meta">${md(ch.meta)}</div>`:''}
 <div class="overview"><div><div class="label">overview</div><p style="font-size:17.5px">${md(ch.context)}</p><ol class="steps-short">${steps.map((s,i)=>`<li><a href="#${ch.id}-s${i+1}">${md(s.short||s.title)}</a></li>`).join('')}</ol></div><div>${(ch.diagrams||[]).map(d=>diagram(d,ch)).join('')}</div></div>
 <div class="walk"><h3>step by step</h3>${steps.map((s,i)=>`<div class="step" id="${ch.id}-s${i+1}"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="body"><h3>${md(s.title)}</h3><div class="chips">${(s.files||[]).map(f=>`<span>${esc(f)}</span>`).join('')}</div>${(s.explain||'').split(/\n\n+/).map(p=>`<p>${md(p)}</p>`).join('')}${(s.code||[]).length?`<details class="code"><summary>show the code (${s.code.length})</summary>${s.code.map(c=>`<div class="excerpt"><div class="fn">${esc(c.file)}</div><pre data-lang="${esc(c.lang||'diff')}">${esc(c.excerpt)}</pre></div>`).join('')}</details>`:''}</div></div>`).join('')}</div>
 ${notes.length?`<div class="notes"><h3>worth a closer look</h3>${main.map((n)=>note(ch,n,notes.indexOf(n))).join('')}${rest.length?`<details class="more"><summary>${rest.length} smaller note${rest.length>1?'s':''}</summary>${rest.map(n=>note(ch,n,notes.indexOf(n))).join('')}</details>`:''}</div>`:''}
 ${ch.verdict?`<p class="verdict"><b>${md(ch.verdict.split(':')[0])}</b>${ch.verdict.includes(':')?': '+md(ch.verdict.split(':').slice(1).join(':')):''}</p>`:''}
 ${(ch.skipped||[]).length?`<p class="skipped">not walked through: ${ch.skipped.map(s=>`<code>${esc(s.path)}</code> (${esc(s.why)})`).join(', ')}</p>`:''}</section>`}
const G=GUIDE, chs=G.chapters||[];
document.getElementById('root').innerHTML=`<div class="prose"><h1>${md(G.title)}</h1><p class="lede">${md(G.lede)}</p></div>${G.picture?`<div class="overview" style="margin-top:8px"><div class="prose">${(G.picture.text||'').split(/\n\n+/).map(p=>`<p>${md(p)}</p>`).join('')}${chs.length>1?`<div class="toc" style="margin-top:18px">${chs.map((c,i)=>`<a href="#${c.id}"><b>${i+1}</b>${md(c.short||c.title)}</a>`).join('')}</div>`:''}</div><div>${(G.picture.diagrams||[]).map(d=>diagram(d)).join('')}</div></div>`:''}${chs.map((c,i)=>chapter(c,i,chs.length)).join('')}${G.closing?`<section class="chapter prose"><h2>${md(G.closing.title||'where this leaves us')}</h2>${(G.closing.text||'').split(/\n\n+/).map(p=>`<p>${md(p)}</p>`).join('')}</section>`:''}`;
function bar(){const b=document.getElementById('bar');b.classList.toggle('on',picks.size>0);document.getElementById('barText').textContent=`${picks.size} note${picks.size>1?'s':''} to ask for`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const id=b.dataset.pick;picks.has(id)?picks.delete(id):picks.add(id);localStorage.setItem(KEY,JSON.stringify([...picks]));b.setAttribute('aria-pressed',picks.has(id));b.textContent=picks.has(id)?'asking for this':'ask for this';bar()});
document.getElementById('send').addEventListener('click',async()=>{const lines=[];for(const ch of chs)(ch.notes||[]).forEach((n,i)=>{if(picks.has(`${ch.id}:${i}`))lines.push(`- ${ch.ref||ch.title}: [${n.severity}] ${n.title} (${n.where||''})`)});try{await albedo.send(`from the guide "${G.title}", please ask for:\n`+lines.join('\n'));document.getElementById('barText').textContent='sent ✓'}catch(e){document.getElementById('barText').textContent='could not send'}});
bar();
import('https://esm.sh/shiki@1.22.0').then(async sh=>{for(const el of document.querySelectorAll('pre[data-lang]')){let lang=el.dataset.lang.toLowerCase();if(lang==='erl')lang='erlang';try{el.outerHTML=await sh.codeToHtml(el.textContent,{lang,themes:{light:'github-light',dark:'github-dark'}})}catch(e){}}}).catch(()=>{});
</script></body></html>
