StylesPath = styles
MinAlertLevel = warning

[formats]
gleam = kt
thrift = php
nix = r
nu = r
sh = r
bash = r
sql = lua
typ = md
jjdescription = md

# Technical documents.
[*.{md,markdown,mdown,markdn,txt,rst,adoc,org,typ}]
BasedOnStyles = plain-technical
TokenIgnores = \bUS\b

# Commit descriptions.
[*.jjdescription]
BasedOnStyles = plain-technical
plain-technical.Pronouns = NO
plain-technical.ResearchLinks = NO
plain-technical.Mermaid = NO
BlockIgnores = (?m)^JJ:.*$

# Code comments across source files. Pronouns and document-structure rules are
# disabled because comments have no headings/diagrams and may address callers.
[*.{go,rs,ts,tsx,js,jsx,py,rb,gleam,nix,nu,sh,bash,c,cc,cpp,h,hpp,lua,proto,sql,thrift,kt,scala,swift,dart,php}]
BasedOnStyles = plain-technical
plain-technical.Pronouns = NO
plain-technical.ResearchLinks = NO
plain-technical.Mermaid = NO
plain-technical.Emphasis = NO
plain-technical.Headings = NO

[**/research/*.md]
plain-technical.ResearchLinks = NO

# Instruction files use a different register: second person, imperative mood,
# and no descriptive-prose pronouns. The Prompts rules encode vendor guidance
# for agent prompts and skills.
[**/{agents/*.md,commands/*.md,gallant/rules/*/*.md,references/*.md,references/*/*.md,AGENTS.md,CLAUDE.md}]
BasedOnStyles = Prompts
Prompts.Trigger = NO
Prompts.ThirdPerson = NO
Prompts.Frontmatter = NO

[**/SKILL.md]
BasedOnStyles = Prompts
