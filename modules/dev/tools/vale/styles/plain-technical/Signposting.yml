extends: existence
message: "State the claim or action directly instead of '%s'."
level: warning
ignorecase: true
tokens:
  - 'the honest take'
  - 'the important thing to (?:understand|note|remember|realize|keep in mind)'
  - 'it(?:''s| is) important to (?:note|remember|understand|keep in mind)'
  - 'it(?:''s| is) worth (?:mentioning|pointing out|noting|remembering)'
  - 'let''s unpack'
  - 'the bottom line'
  - 'at the end of the day'
  - 'first and foremost'
  - 'last but not least'
  - 'in conclusion'
  - 'to summarize'
  - 'this deserves attention'
  - 'the question arises'
  - 'the answer is owed'
  - 'it bears mentioning'
  - 'it should be noted'
  - 'as mentioned (?:above|earlier|previously|before)'
  - 'what I often feel'
  - 'I can''t tell you how many times'
  - 'not only\b[^.!?]+\bbut also'
  - '(?:delve|delves|delved|delving) into'
  - '(?:unpack|unpacks|unpacked|unpacking) this'
  - 'heavy lifting'
  - 'under the hood'
  - 'operationalize(?:s|d|ing)?'
  - 'leverage(?:s|d|ing)?'
  - 'utilize(?:s|d|ing)?'
  - 'underscore(?:s|d|ing)?'
  - 'foster(?:s|ed|ing)?'
  - 'meticulous(?:ly)?'
  - 'multifaceted'
  - 'tapestry'
  - 'testament to'
