[formatter.nix]
command = "nixfmt"
options = ["-s", "-w", "120"]
includes = ["*.nix"]

[formatter.nu]
command = "nufmt"
includes = ["*.nu"]

[formatter.md]
command = "oxfmt"
includes = ["*md"]

[formatter.json]
command = "oxfmt"
options = []
includes = ["*.json"]
# npm lockfiles for pkgs/ are committed as npm itself wrote them: nixpkgs rejects
# a package-lock.json that isn't byte-identical to the one npm regenerates.
excludes = ["secrets/**", "modules/desktop/audio/**", "pkgs/**/*-lock.json"]
